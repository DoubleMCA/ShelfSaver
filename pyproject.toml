[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsaver"
version = "0.6.3"
description = "Watches video library folders and converts worthwhile files to H.265 on the GPU."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1", "watchdog>=6.0,<7", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "httpx2"]

[tool.setuptools.packages.find]
include = ["shelfsaver*"]

[tool.setuptools.package-data]
"shelfsaver.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU with NVENC"]
